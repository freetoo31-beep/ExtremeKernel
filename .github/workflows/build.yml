name: ExtremeKernel - Legacy SuSFS Edition (v3.2.0)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "اختر موديل الجهاز للطبخ"
        required: true
        default: "d2s"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [d1, d1xks, d2s, d2x, d2xks]

    steps:
      # 1. التحقق من الموديل
      - name: Check if build is needed
        id: check
        run: |
          if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      # 2. تحميل كود الكيرنل
      - name: Checkout Kernel Source
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3. تثبيت أدوات البناء
      - name: Install Dependencies
        if: steps.check.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libssl-dev bc

      # 4. تحديث KernelSU-Next وتطبيق التعديلات الهندسية
      - name: Update KSU-Next & Patch Signature Check
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "Cleaning old KSU files..."
          rm -rf drivers/kernelsu
          
          echo "Cloning KSU-Next (legacy_susfs)..."
          git clone -b legacy_susfs https://github.com/KernelSU-Next/KernelSU-Next.git temp_ksu
          cd temp_ksu && git checkout 1b729822596187d8bdcb19906abbb1c9e4357afd && cd ..
          
          echo "Restructuring files for Build System..."
          mkdir -p drivers/kernelsu
          # نقل ملفات الكود من مجلد kernel إلى المجلد الرئيسي
          mv temp_ksu/kernel/* drivers/kernelsu/
          # نقل ملفات uapi إلى المسار العالمي لضمان رؤيتها من المترجم
          mkdir -p include/linux/
          mv temp_ksu/uapi/*.h include/linux/ 2>/dev/null || true
          rm -rf temp_ksu

          echo "Applying Surgical Signature Hack (return true)..."
          # البحث عن ملف apk_sign.c وحقن التخطي بعد أول قوس فتح {
          # ملاحظة: في الإصدارات الجديدة الملف موجود داخل مجلد manager
          find drivers/kernelsu -name "apk_sign.c" -exec sed -i '/check_v2_signature/,/{/ s/{/{\n    return true;/' {} +
          find drivers/kernelsu -name "apk_sign.c" -exec sed -i '/check_v3_signature/,/{/ s/{/{\n    return true;/' {} +

      # 5. تشغيل عملية البناء (تم تحديث KSU_VERSION إلى 33110)
      - name: Build Kernel (${{ matrix.model }})
        if: steps.check.outputs.proceed == 'true'
        run: |
          chmod +x workflows.sh
          # تم الرفع ليتوافق مع متطلبات v3.2.0 الجديدة
          export KSU_VERSION=33110
          yes "" | ./workflows.sh -m ${{ matrix.model }} -k Y -r N

      # 6. رفع ملف الـ ZIP
      - name: Upload Kernel Artifact
        if: steps.check.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-${{ matrix.model }}-Legacy-SuSFS-v3.2.0
          path: build/out/**/*.zip
          if-no-files-found: error
