Name: ExtremeKernel - Legacy SuSFS Edition

on:
  workflow_dispatch:
    inputs:
      model:
        description: "اختر موديل الجهاز للطبخ"
        required: true
        default: "d2s"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [d1, d1xks, d2s, d2x, d2xks]

    steps:
      # 1. التحقق من الموديل
      - name: Check if build is needed
        id: check
        run: |
          if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      # 2. تحميل كود الكيرنل
      - name: Checkout Kernel Source
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3. تثبيت أدوات البناء
      - name: Install Dependencies
        if: steps.check.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libssl-dev bc

      # 4. حقن الإعدادات والاسم (الحل الذكي والقسري)
      - name: Fix Headers & Set Stealth
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "Processing ${{ matrix.model }}..."
          
          # أ- تفعيل خيارات SuSFS في الـ defconfig
          find arch/arm64/configs/ -name "*${{ matrix.model }}*_defconfig" -exec sh -c '
            echo "CONFIG_KSU_SUSFS=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n" >> "$1"
          ' _ {} \;

          # ب- حقن رقم الإصدار والتعريفات مباشرة في ملف ksu.h
          # سنقوم بالبحث عن ملف ksu.h في كل المسارات لضمان عدم الخطأ في المسار
          KSU_H=$(find . -name "ksu.h" | grep "kernelsu" | head -n 1)
          
          if [ -f "$KSU_H" ]; then
            echo "Found ksu.h at: $KSU_H"
            # تنظيف أي تعريفات قديمة قد تسبب تعارض
            sed -i '/#define KSU_VERSION/d' $KSU_H
            sed -i '/#define KSU_VERSION_TAG/d' $KSU_H
            sed -i '/#define EXPECTED_SIZE/d' $KSU_H
            
            # حقن التعريفات الجديدة بعد سطر #define __KSU_H_KSU
            sed -i '/#define __KSU_H_KSU/a #define KSU_VERSION 33129\n#define KSU_VERSION_TAG "legacy_susfs"\n#define EXPECTED_SIZE 0' $KSU_H
            
            echo "Successfully patched $KSU_H"
            # عرض أول 15 سطر للتأكد في سجلات GitHub
            head -n 15 $KSU_H
          else
            echo "⚠️ Warning: ksu.h not found, skipping patch."
          fi
          
          echo "Injection Done!"

      # 5. تشغيل عملية البناء
      - name: Build Kernel (${{ matrix.model }})
        if: steps.check.outputs.proceed == 'true'
        run: |
          chmod +x workflows.sh
          # تأكيد الإصدار للمترجم
          export KSU_VERSION=33129
          yes "" | ./workflows.sh -m ${{ matrix.model }} -k Y -r N

      # 6. رفع ملف الـ ZIP
      - name: Upload Kernel Artifact
        if: steps.check.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-${{ matrix.model }}-Legacy-SuSFS
          path: build/out/**/*.zip
          if-no-files-found: error
