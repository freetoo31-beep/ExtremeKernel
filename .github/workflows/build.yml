Name: ExtremeKernel - Legacy SuSFS Edition

on:
  workflow_dispatch:
    inputs:
      model:
        description: "اختر موديل الجهاز للطبخ"
        required: true
        default: "d2s"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [d1, d1xks, d2s, d2x, d2xks]

    steps:
      # 1. التحقق من الموديل
      - name: Check if build is needed
        id: check
        run: |
          if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      # 2. تحميل كود الكيرنل
      - name: Checkout Kernel Source
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3. تثبيت أدوات البناء
      - name: Install Dependencies
        if: steps.check.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libssl-dev bc

      # 4. حقن الإعدادات والاسم (الحل النهائي لمشكلة الإصدار والوجه العابس)
      - name: Fix Headers & Set Stealth
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "Processing ${{ matrix.model }}..."
          
          # أ- تفعيل خيارات SuSFS في الـ defconfig
          find arch/arm64/configs/ -name "*${{ matrix.model }}*_defconfig" -exec sh -c '
            echo "CONFIG_KSU_SUSFS=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$1"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n" >> "$1"
          ' _ {} \;

          # ب- ضبط رقم الإصدار والاسم وتعطيل فحص الحجم يدوياً وقسرياً
          KSU_H="drivers/kernelsu/ksu.h"
          if [ -f "$KSU_H" ]; then
            # تحديث رقم الإصدار إلى 33129
            sed -i 's/#define KSU_VERSION .*/#define KSU_VERSION 33129/' $KSU_H
            # تحديث التاج إلى legacy_susfs
            sed -i 's/#define KSU_VERSION_TAG .*/#define KSU_VERSION_TAG "legacy_susfs"/' $KSU_H
            # حقن كود إيقاف فحص الحجم (EXPECTED_SIZE 0) لضمان عمل الروت
            if ! grep -q "EXPECTED_SIZE" "$KSU_H"; then
               sed -i '/#define __KSU_H_KSU/a #define EXPECTED_SIZE 0' $KSU_H
            else
               sed -i 's/#define EXPECTED_SIZE .*/#define EXPECTED_SIZE 0/' $KSU_H
            fi
            echo "Successfully patched $KSU_H"
          else
            echo "Error: $KSU_H not found!"
            exit 1
          fi
          
          echo "Injection Done!"

      # 5. تشغيل عملية البناء بمتغيرات البيئة الصحيحة
      - name: Build Kernel (${{ matrix.model }})
        if: steps.check.outputs.proceed == 'true'
        run: |
          chmod +x workflows.sh
          # تمرير الإصدار الصحيح للمترجم كأولوية قصوى
          export KSU_VERSION=33129
          yes "" | ./workflows.sh -m ${{ matrix.model }} -k Y -r N

      # 6. رفع ملف الـ ZIP الناتج
      - name: Upload Kernel Artifact
        if: steps.check.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-${{ matrix.model }}-Legacy-SuSFS
          path: build/out/**/*.zip
          if-no-files-found: error
