name: ExtremeKernel - Legacy SuSFS Edition

on:
  workflow_dispatch:
    inputs:
      model:
        description: "اختر موديل الجهاز للطبخ"
        required: true
        default: "d2s"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [d1, d1xks, d2s, d2x, d2xks]

    steps:
      # 1. التحقق من الموديل
      - name: Check if build is needed
        id: check
        run: |
          if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      # 2. تحميل كود الكيرنل (وسحب الروت من روابط الـ Submodule)
      - name: Checkout Kernel Source
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive' # <--- هذا السطر يسحب الروت تلقائياً من المستودع

      # 3. تثبيت أدوات البناء
      - name: Install Dependencies
        if: steps.check.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libssl-dev bc jq

      # 4. جلب رقم إصدار الروت (KernelSU-Next) ديناميكياً
      - name: Fetch KernelSU Version
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "🔍 Fetching latest KernelSU-Next version from GitHub..."
          LATEST_KSU_VERSION=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest" | grep '"tag_name":' | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')
          
          # إذا فشل في جلب الإصدار لأي سبب، نضع رقماً افتراضياً لمنع توقف البناء
          if [ -z "$LATEST_KSU_VERSION" ]; then
            echo "⚠️ Could not fetch version, using fallback."
            LATEST_KSU_VERSION="v1.0.5"
          fi
          
          echo "✅ Detected KernelSU Version: $LATEST_KSU_VERSION"
          # حفظ الرقم في متغير البيئة ليتم استخدامه في الخطوات القادمة
          echo "KSU_VERSION=$LATEST_KSU_VERSION" >> $GITHUB_ENV

      # 5. تشغيل عملية البناء
      - name: Build Kernel (${{ matrix.model }})
        if: steps.check.outputs.proceed == 'true'
        run: |
          chmod +x workflows.sh
          echo "🚀 Building ExtremeKRNL with KSU Version: $KSU_VERSION"
          # سيقوم السكربت بوراثة KSU_VERSION تلقائياً
          yes "" | ./workflows.sh -m ${{ matrix.model }} -k Y -r N

      # 6. رفع ملف الـ ZIP (مع إضافة رقم الإصدار في الاسم)
      - name: Upload Kernel Artifact
        if: steps.check.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-${{ matrix.model }}-Legacy-SuSFS-${{ env.KSU_VERSION }}
          path: build/out/**/*.zip
          if-no-files-found: error
