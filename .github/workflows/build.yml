name: ExtremeKernel - Official Raw SuSFS (Samsung Fixed)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "اختر موديل الجهاز للطبخ"
        required: true
        default: "d2s"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [d1, d1xks, d2s, d2x, d2xks]

    steps:
      - name: Check if build is needed
        id: check
        run: |
          if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

            - name: Checkout Kernel Source
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'


      - name: 1. Fetch RAW Official KernelSU-Next
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "🛠️ Fetching Official RAW KernelSU-Next Submodule..."
          rm -rf KernelSU-Next
          
          # استنساخ المستودع الرسمي الخام
          git clone -b legacy-susfs https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          
          # قفل الكود على التحديث المستقر
          cd KernelSU-Next
          git checkout 4cc162e027cc36f8e4d4e6a554e9aa07cac4d4f0
          cd ..
          
          echo "✅ Successfully fetched Official RAW branch!"

      - name: Install Dependencies
        if: steps.check.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libssl-dev bc jq

      - name: 2. Magic Conflict Fixes & Samsung Bypasses
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "🔍 Fixing API Conflicts and applying Samsung patches..."
          
          # أ- حل مشكلة تعارض SuSFS بين النواة والروت الرسمي
          if [ -f "include/linux/susfs.h" ]; then
            sed -i 's/void susfs_add_try_umount(void __user \*\*user_info)/int susfs_add_try_umount(void __user \*arg)/g' include/linux/susfs.h
            echo "✅ Fixed susfs_add_try_umount in header"
          fi
          
          if [ -f "fs/susfs.c" ]; then
            sed -i 's/void susfs_add_try_umount(void __user \*\*user_info)/int susfs_add_try_umount(void __user \*arg)/g' fs/susfs.c
            echo "✅ Fixed susfs_add_try_umount in C file"
          fi

          # ب- تغيير رقم الإصدار ليتوافق مع المدير 3.2.0 (إخفاء المربع الأحمر)
          KSU_H_PATH=$(find KernelSU-Next -name "ksu.h" | grep "include" | head -n 1)
          if [ -n "$KSU_H_PATH" ]; then
            sed -i 's/#define KSU_VERSION .*/#define KSU_VERSION 33129/g' "$KSU_H_PATH"
            echo "✅ Patched Manager Version to 33129"
          fi

          # ج- إصلاح مشكلة التعليق والجمود عند التثبيت
          if [ -f "KernelSU-Next/kernel/ksu_lsm_hooks.c" ]; then
            sed -i 's/LSM_HOOK_INIT(inode_rename, ksu_inode_rename),/\/\/ LSM_HOOK_INIT(inode_rename, ksu_inode_rename),/g' KernelSU-Next/kernel/ksu_lsm_hooks.c
            echo "✅ Disabled inode_rename hook (Fixes Installation Freeze)"
          fi

          # د- إصلاح مشكلة الـ Reboot عند فتح التطبيق على Samsung
          if [ -f "KernelSU-Next/kernel/setuid_hook.c" ]; then
            sed -i 's/disable_seccomp(current);/\/\/ disable_seccomp(current);/g' KernelSU-Next/kernel/setuid_hook.c
            echo "✅ Disabled seccomp bypass (Fixes App Opening Reboot)"
          fi

          echo "KSU_VERSION=33129" >> $GITHUB_ENV
          echo "KSU_NAME=Official-RAW-SuSFS" >> $GITHUB_ENV

      - name: Build Kernel (${{ matrix.model }})
        if: steps.check.outputs.proceed == 'true'
        run: |
          chmod +x workflows.sh
          echo "🚀 Building ExtremeKRNL..."
          yes "" | ./workflows.sh -m ${{ matrix.model }} -k Y -r N

      - name: Upload Kernel Artifact
        if: steps.check.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-${{ matrix.model }}-${{ env.KSU_NAME }}-v${{ env.KSU_VERSION }}
          path: build/out/**/*.zip
          if-no-files-found: error

