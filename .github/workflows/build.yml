name: ExtremeKernel - Legacy SuSFS Edition

on:
  workflow_dispatch:
    inputs:
      model:
        description: "اختر موديل الجهاز للطبخ"
        required: true
        default: "d2s"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [d1, d1xks, d2s, d2x, d2xks]

    steps:
      # 1. التحقق من الموديل
      - name: Check if build is needed
        id: check
        run: |
          if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      # 2. تحميل كود الكيرنل (مع السحب التلقائي للـ Submodules)
      - name: Checkout Kernel Source
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      # 3. تثبيت أدوات البناء
      - name: Install Dependencies
        if: steps.check.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libssl-dev bc jq

      # 4. تعديل رقم الإصدار داخل كود الروت (حل مشكلة المربع الأحمر)
      - name: Patch KernelSU Version
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "🛠️ Patching ksu.h at Kernel/include/ksu.h..."
          # المسار الجديد الذي حددته أنت
          KSU_H="Kernel/include/ksu.h"
          
          if [ -f "$KSU_H" ]; then
            # تحديث رقم الإصدار إلى 33129 ليتوافق مع المدير
            sed -i 's/#define KSU_VERSION .*/#define KSU_VERSION 33129/g' $KSU_H
            echo "✅ ksu.h patched successfully with version 33129!"
          else
            echo "❌ Error: ksu.h not found at $KSU_H! Build will stop to prevent version mismatch."
            exit 1
          fi
          
          # حفظ المتغيرات لاستخدامها في تسمية الملف النهائي
          echo "KSU_VERSION=33129" >> $GITHUB_ENV
          echo "KSU_NAME=Legacy-SuSFS" >> $GITHUB_ENV

      # 5. تشغيل عملية البناء
      - name: Build Kernel (${{ matrix.model }})
        if: steps.check.outputs.proceed == 'true'
        run: |
          chmod +x workflows.sh
          echo "🚀 Building ExtremeKRNL with patched KSU Version: ${{ env.KSU_VERSION }}"
          yes "" | ./workflows.sh -m ${{ matrix.model }} -k Y -r N

      # 6. رفع ملف الـ ZIP النهائي
      - name: Upload Kernel Artifact
        if: steps.check.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-${{ matrix.model }}-${{ env.KSU_NAME }}-v${{ env.KSU_VERSION }}
          path: build/out/**/*.zip
          if-no-files-found: error
