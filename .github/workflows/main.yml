name: Fix Submodule & Symlink Structure

on:
  workflow_dispatch:

jobs:
  fix-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config user.name "Devandroid-bit"
          git config user.email "samirmami533@gmail.com"

      - name: 1. Clean up wrong placement
        run: |
          echo "Removing wrongly placed submodule from drivers..."
          git rm -rf --cached drivers/kernelsu || true
          rm -rf drivers/kernelsu
          rm -rf .git/modules/drivers/kernelsu
          
          if [ -f .gitmodules ]; then
            sed -i '/\[submodule "drivers\/kernelsu"\]/,+3d' .gitmodules || true
            [ -s .gitmodules ] || rm .gitmodules
          fi
          
          git add -A
          git commit -m "chore: wipe wrong submodule placement" || true

      - name: 2. Inject Submodule at ROOT (The Blue Folder)
        run: |
          echo "Adding Sidex15 KernelSU as a direct submodule in the ROOT directory..."
          git submodule add -b legacy-susfs-v2 https://github.com/sidex15/KernelSU-Next.git KernelSU-Next
          
          echo "Locking submodule to the exact commit: 00cb93e..."
          cd KernelSU-Next
          git checkout 00cb93e0bc8bf3ca3680c7e8a3d7cf11d0b59071
          cd ..

      - name: 3. Create the Symlink in drivers/
        run: |
          echo "Creating the symbolic link in drivers folder..."
          mkdir -p drivers
          cd drivers
          # هذا هو الأمر الذي يصنع الاختصار بالسهم كما في صورتك
          ln -s ../KernelSU-Next/kernel kernelsu
          cd ..

      - name: 4. Finalize and Push
        run: |
          echo "Pushing changes to repository..."
          git add .gitmodules KernelSU-Next drivers/kernelsu
          git commit -m "feat: structured KernelSU submodule at root with symlink in drivers" || true
          git push origin main
