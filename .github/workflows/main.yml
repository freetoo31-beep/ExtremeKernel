name: Update KSU-Next (Physical Files & Patch)

on:
  workflow_dispatch:

jobs:
  update_ksu_and_patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config user.name "Devandroid-bit"
          git config user.email "samirmami533@gmail.com"

      - name: 1. Nuclear Cleanup (Remove Submodule)
        run: |
          echo "Removing submodule from Git index..."
          git rm -rf --cached drivers/kernelsu || true
          
          echo "Deleting physical files and symlinks..."
          rm -rf drivers/kernelsu
          rm -rf .git/modules/drivers/kernelsu
          
          echo "Cleaning .gitmodules file..."
          if [ -f .gitmodules ]; then
            sed -i '/\[submodule "drivers\/kernelsu"\]/,+3d' .gitmodules || true
            [ -s .gitmodules ] || rm .gitmodules
          fi

      - name: 2. Fetch KernelSU-Next (legacy_susfs @ 1b72982)
        run: |
          echo "Cloning the legacy_susfs branch..."
          git clone -b legacy_susfs https://github.com/KernelSU-Next/KernelSU-Next.git temp_ksu
          
          cd temp_ksu
          echo "Checking out the specific commit..."
          git checkout 1b729822596187d8bdcb19906abbb1c9e4357afd
          
          echo "Destroying .git folder..."
          rm -rf .git
          cd ..
          
          echo "Moving ACTUAL driver files from the 'kernel' folder..."
          mkdir -p drivers/kernelsu
          
          # التعديل السحري هنا: نقل محتويات مجلد kernel فقط بدلاً من كل شيء
          mv temp_ksu/kernel/* drivers/kernelsu/
          
          # تنظيف الملفات المؤقتة
          rm -rf temp_ksu


      - name: 3. Inject Signature Hack (Auto-Patch)
        run: |
          echo "Finding apk_sign.c and injecting 'return true;' to disable Manager Verification..."
          # حقن التخطي في دالة v2
          find drivers/kernelsu -name "apk_sign.c" -exec sed -i '/bool check_v2_signature/,/^{/!b;//a\    return true;' {} +
          # حقن التخطي في دالة v3 (إن وجدت في هذا الإصدار)
          find drivers/kernelsu -name "apk_sign.c" -exec sed -i '/bool check_v3_signature/,/^{/!b;//a\    return true;' {} +

      - name: 4. Finalize, Commit and Push
        run: |
          echo "Staging all files..."
          git add -A
          git commit -m "feat: Replace KSU submodule with physical files (legacy_susfs @ 1b72982) & Auto-Disable APK Sign Check" || echo "No changes to commit"
          git push origin Mai31
