name: Nuclear Cleanup & Submodule Setup

on:
  workflow_dispatch:

jobs:
  setup-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config user.name "Devandroid-bit"
          git config user.email "samirmami533@gmail.com"

      - name: 1. Nuclear Cleanup (Remove Local Files)
        run: |
          echo "Removing local kernelsu files and clearing cache..."
          git rm -rf --cached drivers/kernelsu || true
          rm -rf drivers/kernelsu
          rm -rf .git/modules/drivers/kernelsu
          
          if [ -f .gitmodules ]; then
            sed -i '/\[submodule "drivers\/kernelsu"\]/,+3d' .gitmodules || true
            [ -s .gitmodules ] || rm .gitmodules
          fi
          
          git add -A
          git commit -m "chore: wipe local kernelsu files to prepare for submodule" || true

      - name: 2. Inject Submodule at Specific Commit (The Blue Folder)
        run: |
          echo "Adding Sidex15 KernelSU as a direct submodule..."
          git submodule add -b legacy-susfs-v2 https://github.com/sidex15/KernelSU-Next.git drivers/kernelsu
          
          echo "Locking submodule to the exact commit: 00cb93e0bc8bf3ca3680c7e8a3d7cf11d0b59071..."
          cd drivers/kernelsu
          git checkout 00cb93e0bc8bf3ca3680c7e8a3d7cf11d0b59071
          cd ../../
          
      - name: 3. Finalize and Push
        run: |
          echo "Pushing changes to repository..."
          git add .gitmodules drivers/kernelsu
          git commit -m "feat: added sidex15 legacy-susfs-v2 submodule pinned at commit 00cb93e" || true
          git push origin main
