name: Fix Submodule & Symlink Structure

on:
  workflow_dispatch:

jobs:
  fix-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Mai31 
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config user.name "Devandroid-bit"
          git config user.email "samirmami533@gmail.com"

      - name: 1. Nuclear Clean (مسح شامل لكل الأثار القديمة)
        run: |
          # إلغاء تسجيل أي Submodule قديم بقوة
          git submodule deinit -f --all || true
          
          # مسح المجلدات والذاكرة المخفية
          git rm -rf --cached drivers/kernelsu || true
          git rm -rf --cached KernelSU-Next || true
          rm -rf .git/modules/drivers/kernelsu || true
          rm -rf .git/modules/KernelSU-Next || true
          rm -rf drivers/kernelsu
          rm -rf KernelSU-Next
          rm -f .gitmodules
          
          git add -A
          git commit -m "chore: nuclear cleanup of submodules" || true

      - name: 2. Inject Submodule & Force Format
        run: |
          # إضافة الـ Submodule مع استخدام --force لتخطي أي قيود
          git submodule add --force -b legacy-susfs https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          
          # إعادة كتابة الملف بالشكل الذي طلبته بالضبط
          echo '[submodule "KernelSU-Next"]' > .gitmodules
          echo '	path = KernelSU-Next' >> .gitmodules
          echo '	url = https://github.com/KernelSU-Next/KernelSU-Next' >> .gitmodules
          echo '	branch = legacy-susfs' >> .gitmodules

      - name: 3. Lock Submodule to Specific Commit
        run: |
          cd KernelSU-Next
          git fetch origin legacy-susfs
          # الانتقال للالتزام (Commit) الجديد الخاص بالمستودع الرسمي
          git checkout 4cc162e027cc36f8e4d4e6a554e9aa07cac4d4f0
          cd ..
          # تحديث مؤشر الـ Submodule في المستودع الرئيسي
          git add KernelSU-Next

      - name: 4. Create Symbolic Link
        run: |
          mkdir -p drivers
          cd drivers
          # حذف أي رابط قديم أو مجلد قديم هناك
          rm -rf kernelsu 
          # إنشاء الرابط الرمزي
          ln -s ../KernelSU-Next/kernel kernelsu
          cd ..
          # إضافة الرابط الرمزي يدوياً للتأكد من تسجيله كـ Link وليس كمجلد
          git add drivers/kernelsu

      - name: 5. Finalize and Push to Mai31
        run: |
          git add .gitmodules
          git commit -m "feat: switch to official KernelSU-Next legacy-susfs branch at specific commit" || true
          # استخدام --force عند الدفع لضمان تطبيق الهيكلية الجديدة
          git push origin Mai31 
